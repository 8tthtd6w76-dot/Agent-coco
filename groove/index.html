<html lang="en"><head><meta charset="utf-8">

<title>Groove Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">

<meta name="apple-mobile-web-app-title" content="Groove Studio">

<style>
/* Layout: one-screen phone app. Sticky transport on top, seven swipeable pages in the middle, a tab bar at the bottom.
   Same look as the desktop Groove Studio: graphite neutrals, periwinkle accent, every instrument in its own color. */
:root{
  --bg:#121419;--bg2:#181b22;--bg3:#1f232c;--bg4:#272c38;--line:#2a2f3b;--line2:#353b4a;--txt:#e7e9ef;--dim:#8a91a3;--mute:#5d6477;
  --acc:#7b8cff;--acc2:#a3afff;--accbg:#2a3160;--rec:#ff4d5e;--ok:#6bcb77;--warn:#ffd93d;--white-key:#e9ebf1;--black-key:#20232b;--ink:#111318;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:14px/1.3 var(--ui);display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,select,input,textarea{font:inherit;color:var(--txt)}
button{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;cursor:pointer;touch-action:manipulation;min-height:38px}
button:active{background:var(--bg4)}
button.on{background:var(--accbg);border-color:var(--acc);color:#fff}
button:disabled{opacity:.4}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
select{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:8px 6px;min-height:38px;max-width:100%}
input[type=text],textarea{background:#0d0f13;border:1px solid var(--line2);border-radius:8px;padding:9px;width:100%;-webkit-user-select:text;user-select:text}
textarea{min-height:110px;font:12px var(--mono)}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;width:100%;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc2);margin-top:-8px;border:0}
.hint{color:var(--dim);font-size:12px}
h3{margin:0;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}

/* ---------- top bar ---------- */
#top{flex:none;background:var(--bg2);border-bottom:1px solid var(--line);padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.r1,.r2{display:flex;align-items:center;gap:6px}
.logo{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 200deg,#ff7eb6,#7b8cff,#4dd4ff,#6bcb77,#ffd93d,#ff7eb6);flex:none}
.logo.beat{box-shadow:0 0 10px 2px #7b8cff}
#songName{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 2px;font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:40px;padding:0;font-size:17px;flex:none}
#bPlay{width:58px;height:44px;font-size:20px;flex:none}
#bPlay.on{background:var(--ok);border-color:var(--ok);color:var(--ink)}
#bRec{width:46px;height:44px;color:var(--rec);font-size:18px;flex:none}
#bRec.on{background:var(--rec);color:#fff;border-color:var(--rec);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.lcd{background:#0b0d11;border:1px solid var(--line2);border-radius:9px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;font:600 15px var(--mono);font-variant-numeric:tabular-nums;color:#cfe0ff;min-width:0}
.lcd small{font:600 9px var(--ui);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
#pos{width:54px;flex:none}
#bBpm{flex:1}#bKey{flex:1.2}
#bLoop{width:44px;height:44px;padding:0;flex:none;font-size:18px}

/* ---------- pages ---------- */
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;-webkit-overflow-scrolling:touch;
  padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:8px}
.ph h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ph .hint{margin-left:auto;text-align:right}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>select{flex:1;min-width:0}
.grow{flex:1;min-width:0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;min-height:34px;padding:6px 10px;background:var(--bg3)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accbg)}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--dim)}

/* track picker on every instrument page */
.tbar{display:flex;gap:6px;align-items:center}
.tbar .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.tbar select{flex:1;min-width:0;font-weight:600}
.cbar{display:flex;gap:6px;align-items:center}
.cbar .lbl{flex:1;text-align:center;font-size:13px;color:var(--dim)}

/* sliders */
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.knob{display:flex;flex-direction:column;gap:0;min-width:0}
.knob b{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--dim)}
.knob b em{font-style:normal;color:var(--txt);font-variant-numeric:tabular-nums}

/* pads */
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}
.pad{aspect-ratio:1;max-width:100%;border-radius:14px;background:color-mix(in srgb,var(--c) 20%,var(--bg3));border:1px solid color-mix(in srgb,var(--c) 50%,var(--bg3));border-bottom:4px solid var(--c);
  display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px;font-size:11px;font-weight:600;color:#d5d9e4;position:relative;overflow:hidden}
.pad .em{font-size:22px;line-height:1}
.pad.sel{box-shadow:0 0 0 2px #fff}
.pad.hit{background:var(--c);color:var(--ink)}
.pad.smp::after{content:"";position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* jam */
.jdrums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;touch-action:none}
.jdrums .pad{aspect-ratio:auto;height:64px;align-items:center;justify-content:center;gap:3px;padding:4px 2px;font-size:11px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 10px;border-radius:12px;min-width:66px;
  background:color-mix(in srgb,var(--c) 14%,var(--bg3));border:1px solid color-mix(in srgb,var(--c) 40%,var(--bg3));border-bottom:4px solid var(--c);font-size:12px;font-weight:600}
.chip .em{font-size:19px;line-height:1}
.chip.on{background:color-mix(in srgb,var(--c) 42%,var(--bg3));border-color:#fff;color:#fff}
.bigplay{min-height:56px;font-size:18px;font-weight:700;flex:1}
.bigplay.on{background:var(--ok);border-color:var(--ok);color:var(--ink)}
#qstatus{min-height:34px;padding:8px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:13px}
.live{display:flex;flex-wrap:wrap;gap:6px}
.live span{border:1px solid color-mix(in srgb,var(--c) 60%,transparent);color:var(--txt);border-radius:999px;padding:3px 9px;font-size:12px;background:color-mix(in srgb,var(--c) 12%,transparent)}

/* keyboard */
.kb{display:flex;height:132px;gap:3px;touch-action:none;position:relative}
.kb .w{flex:1;background:var(--white-key);border-radius:0 0 8px 8px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;padding-bottom:6px;color:#666;font-size:10px;font-weight:600}
.kb .w.ink{background:color-mix(in srgb,var(--c) 18%,var(--white-key))}
.kb .w.out{background:#9da2ad;color:#555}
.kb .w.root::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);margin-bottom:auto;margin-top:auto}
.kb .w.down{background:var(--c);color:var(--ink)}
.kb .b{position:absolute;top:0;width:62%;height:58%;left:69%;background:var(--black-key);border-radius:0 0 6px 6px;z-index:2;border:1px solid #000}
.kb .b.ink{background:color-mix(in srgb,var(--c) 30%,var(--black-key))}
.kb .b.out{background:#3a3e48}
.kb .b.down{background:var(--c)}

/* editors */
.edwrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0f1116}
canvas.ed{display:block;width:100%;touch-action:none}
canvas.wave{display:block;width:100%;height:96px;border-radius:10px;background:#0f1116;border:1px solid var(--line)}
.pager{display:flex;gap:4px;flex-wrap:wrap}
.pager button{min-width:44px;min-height:32px;padding:4px 8px;font-size:12px}

/* voice */
.recbig{width:124px;height:124px;border-radius:50%;border:4px solid var(--rec);background:radial-gradient(circle,#ff4d5e 0 40%,#3a1f26 41%);color:transparent;align-self:center;font-size:0}
.recbig.on{background:radial-gradient(circle,#fff 0 22%,#ff4d5e 23%);animation:pulse 1s infinite}
.vu{height:8px;border-radius:4px;background:#0b0d11;overflow:hidden;border:1px solid var(--line)}
.vu i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn) 75%,var(--rec))}
.takes{display:flex;gap:6px;overflow-x:auto}

/* song */
.arr{display:grid;grid-template-columns:96px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.heads{border-right:1px solid var(--line);display:flex;flex-direction:column}
.heads .corner{height:28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:2px}
.heads .corner button{min-height:24px;height:24px;width:30px;padding:0;font-size:14px}
.th{height:48px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 6px 0 9px;position:relative}
.th::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.th.sel{background:var(--bg3)}
.th .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .ms{display:flex;gap:4px}
.th .ms button{min-height:20px;height:20px;width:26px;padding:0;font-size:10px;font-weight:700;border-radius:5px}
.th .ms button.m.on{background:#5a4a1a;border-color:var(--warn);color:var(--warn)}
.th .ms button.s.on{background:#1d4a2a;border-color:var(--ok);color:var(--ok)}
.lanes{overflow-x:auto;overflow-y:hidden;position:relative;-webkit-overflow-scrolling:touch}
.lanesin{position:relative}
.ruler{height:28px;border-bottom:1px solid var(--line);position:relative;background:#14161c}
.ruler span{position:absolute;top:6px;font:600 10px var(--mono);color:var(--dim);padding-left:4px;border-left:1px solid var(--line2);height:22px}
.ruler .sec{top:0;height:12px;font:600 9px var(--ui);color:var(--acc2);border-left:2px solid var(--acc);padding-left:3px}
.lane{height:48px;border-bottom:1px solid var(--line);position:relative}
.clip{position:absolute;top:4px;bottom:4px;border-radius:7px;background:color-mix(in srgb,var(--c) 30%,var(--bg3));border:1px solid color-mix(in srgb,var(--c) 70%,var(--bg3));overflow:hidden}
.clip.sel{border:2px solid #fff}
.clip canvas{position:absolute;inset:0;width:100%;height:100%}
.clip b{position:absolute;left:5px;top:2px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
.loopshade{position:absolute;top:0;height:100%;background:rgba(123,140,255,.09);border-inline:2px solid rgba(123,140,255,.6);pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;box-shadow:0 0 6px #fff}
.cliptools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cliptools button{padding:6px 4px;font-size:12px}

/* tab bar */
#tabs{flex:none;display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg2);border-top:1px solid var(--line);
  padding-bottom:max(4px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tabs button{background:none;border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 4px;font-size:10px;font-weight:600;color:var(--dim);min-height:50px}
#tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--acc2)}
#tabs button.on svg{filter:drop-shadow(0 0 6px rgba(123,140,255,.7))}
#tabs button.lit{color:var(--txt)}

/* sheets, toast */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
#scrim.show{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86%;background:var(--bg2);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
  transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column;
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
#sheet.show{transform:none}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
#sheet .sh h2{margin:0;font-size:17px;flex:1}
#sheet .sb{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;min-height:46px;width:100%}
.mitem span{margin-left:auto;color:var(--dim);font-size:12px}
.mgroup{display:flex;flex-direction:column;gap:6px}
.keygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.song-item{display:flex;gap:8px;align-items:center}
.song-item .mitem{flex:1;min-width:0}
.song-item .mitem b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.danger{color:#ff8a95;border-color:#5a2a33}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translate(-50%,-20px);opacity:0;z-index:60;pointer-events:none;
  background:#262b37;border:1px solid var(--line2);color:var(--txt);padding:10px 14px;border-radius:12px;font-size:13px;max-width:calc(100% - 32px);transition:opacity .15s,transform .15s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--rec)}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}#bRec.on,.recbig.on{animation:none}}
@media (min-width:700px){.page{max-width:none}.page>*{width:100%;max-width:620px;margin-inline:auto}}
.page>*{flex-shrink:0}
#bKey #keyV{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-family:var(--ui);font-weight:700}
.seg.mini{align-items:center}
.seg.mini button{min-width:30px;padding:4px 6px;min-height:32px}
.seg.mini span{font-size:11px;color:var(--dim);padding:0 4px;border-inline:1px solid var(--line2);align-self:stretch;display:flex;align-items:center}

</style>
<header id="top">
 <div class="r1"><span class="logo" aria-hidden="true"></span><button id="songName" type="button" title="Rename the song">Untitled Song</button>
  <button id="bUndo" class="ico" type="button" aria-label="Undo">↶</button><button id="bRedo" class="ico" type="button" aria-label="Redo">↷</button>
  <button id="bMenu" class="ico" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
 <div class="r2"><button id="bPlay" type="button" aria-label="Play or stop">▶</button><button id="bRec" type="button" aria-label="Record">●</button>
  <button id="pos" class="lcd" type="button" title="Tap to go back to the start">1.1<small>bar</small></button>
  <button id="bBpm" class="lcd" type="button"><span id="bpmV">100</span><small>BPM</small></button>
  <button id="bKey" class="lcd" type="button"><span id="keyV" style="font-size:13px">C Major</span><small>Key</small></button>
  <button id="bLoop" type="button" aria-label="Loop on or off">⟲</button></div>
</header>
<main id="pages"></main>
<nav id="tabs" role="tablist"></nav>
<div id="scrim"></div><div id="sheet" role="dialog" aria-modal="true"></div><div id="toast" role="status"></div>
<script>
const WORKLET_URL=URL.createObjectURL(new Blob(["// mic capture: posts raw chunks stamped with the context time of their first frame.\n// With {feat:true} it also posts loudness per 512-sample hop (whole signal + lows), which the Smart Guide uses to find the beat.\nclass Rec extends AudioWorkletProcessor{constructor(){super();this.on=false;this.feat=false;this.n=0;this.lp=0;this.eF=0;this.eL=0;this.k=0;this.buf=[];this.t0=0;\n this.port.onmessage=e=>{if('on' in e.data)this.on=e.data.on;if('feat' in e.data)this.feat=e.data.feat;};}\nprocess(inp){const ch=inp[0]&&inp[0][0];if(ch){let p=0;for(let i=0;i<ch.length;i++){const v=Math.abs(ch[i]);if(v>p)p=v;}\n this.n++;if(this.on||this.n%6===0)this.port.postMessage({t:currentTime,lvl:p,d:this.on?ch.slice():null});\n if(this.feat){const a=Math.exp(-2*Math.PI*150/sampleRate);let lp=this.lp,eF=0,eL=0;\n  for(let i=0;i<ch.length;i++){const x=ch[i];lp=a*lp+(1-a)*x;eF+=x*x;eL+=lp*lp;}this.lp=lp;\n  if(this.k===0&&!this.buf.length)this.t0=currentTime;this.eF+=eF;this.eL+=eL;\n  if(++this.k===4){this.buf.push(this.eF,this.eL);this.eF=0;this.eL=0;this.k=0;\n   if(this.buf.length>=16){this.port.postMessage({feat:this.buf,t0:this.t0,hop:512/sampleRate});this.buf=[];}}}}\n return true;}}registerProcessor('rec-tap',Rec);\n"],{type:"application/javascript"}));
</script>
<script>
/* ---- audio.js (from the desktop Groove Studio, unchanged) ---- */
// ===== Groove Studio audio core: context, buses, channel strips, drum kits, metronome, WAV, pitch shift =====
'use strict';
const MUSIC_LITE=false;
let MUS=null;               // {a: AudioContext, rev: reverb input} — the FM-1 engine reads this
let AC=null;                // the live AudioContext
const mtof=m=>440*Math.pow(2,(m-69)/12);
function gainTo(dest,send=0){const g=MUS.a.createGain();g.connect(dest);if(send&&MUS.rev){const s=MUS.a.createGain();s.gain.value=send;g.connect(s);s.connect(MUS.rev);}return g;}
function filt(type,f,q,out){const b=MUS.a.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.connect(out);return b;}

// one reverb impulse, made once per sample rate

function playNote(M,tr,m,t,dur,v){const old=MUS;MUS={a:M.a,rev:M.rev};try{fm1Note(tr.patch,Math.max(t,M.a.currentTime),mtof(m),dur,v,stripFor(M,tr).in,spb()/4);}finally{MUS=old;}}

// ---------- scheduling one stretch of the song ----------
// sch(M, s0, s1, timeOf, jump): play everything whose start is in song beats [s0,s1). timeOf(beat)->context time.

function sch(M,s0,s1,timeOf,jump,stopAt){const sp=spb(),sw=P.swing*sp/4;
 for(const tr of P.tracks){for(const c of tr.clips){const ce=c.start+c.len;if(ce<=s0||c.start>=s1)continue;const pl=Math.max(.0625,c.plen||c.len);
  if(tr.type==='audio'){if(!c.src)continue;const b=clipBuf(c);if(!b)continue;
   for(let k=Math.max(0,Math.floor((s0-c.start)/pl));;k++){const rs=c.start+k*pl;if(rs>=s1||rs>=ce)break;const re=Math.min(rs+pl,ce);

    if(M===MIX)for(let q=Math.ceil(st*2)/2;q<en;q+=.5)VIS.push({t:timeOf(q),tr:tr.id,p:-1});}   // a voice glows on every 8th while it sounds
   continue;}
  for(let k=Math.max(0,Math.floor((s0-c.start)/pl)-1);;k++){const rs=c.start+k*pl;if(rs>=s1||rs>=ce)break;

    if(tr.type==='drums')playPad(M,tr,n.p,t,n.v);else playNote(M,tr,n.m,t,Math.min(n.d,ce-at)*sp,n.v);

 if(M===MIX&&P.metro||T.rec&&T.rec.click)for(let b=Math.ceil(s0-1e-6);b<s1;b++)if(M===MIX)clickAt(M,timeOf(b),((b%4)+4)%4===0);}
function playAudio(M,tr,c,b,t,off,tEnd,fadeIn,fadeOut){const a=M.a,s=a.createBufferSource();s.buffer=b;const g=a.createGain(),gv=c.gain==null?1:c.gain,sp=spb();

T.srcs=[];

// linear beats since Play -> song beat, honoring the loop
function loopOn(){return P.loop.on&&P.loop.b>P.loop.a;}
function songAt(L){const b=T.b0+L;if(!loopOn()||T.b0>=P.loop.b)return b;const {a,b:lb}=P.loop;if(b<lb)return b;return a+((b-lb)%(lb-a));}
// split linear [L1,L2) into song stretches: [{s0,s1,l0,jump}]
function pieces(L1,L2){const out=[];let L=L1;

const AHEAD=.15;
function tick(){if(!T.playing)return;const sp=spb(),Lnow=(AC.currentTime-T.t0)/sp,Lto=Lnow+AHEAD/sp;
 if(Lto>T.L){for(const p of pieces(T.L,Lto)){const lp=loopOn()&&T.b0<P.loop.b&&p.s0<P.loop.b?P.loop.b:null;
   sch(MIX,p.s0,p.s1,x=>T.t0+(p.l0+x-p.s0)*sp,p.jump,lp);}T.L=Lto;}}
function headNow(){if(!T.playing)return T.head;return songAt((AC.currentTime-T.t0)/spb());}
async function play(from,at){await ensureAudio();if(T.playing)stop(true);updateMix();

 // cut ringing synth notes / drum tails by ducking each strip briefly
 if(MIX)for(const id in MIX.strips){const g=MIX.strips[id].in.gain,t=AC.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+.03);g.setValueAtTime(0,t+.25);g.linearRampToValueAtTime(1,t+.27);}

function emit(e){T.listeners.forEach(f=>f(e));}

// ---------- live input (pads + keys), and recording notes ----------

function livePad(tr,p,v=1){if(!AC)return;playPad(MIX,tr,p,AC.currentTime,v);VIS.push({t:0,tr:tr.id,p});if(T.rec&&T.rec.kind==='notes'&&T.rec.tr===tr.id)recNote({p,v});}
function liveKeyDown(tr,m,v=.9){if(!AC||HELD[tr.id+':'+m])return;VIS.push({t:0,tr:tr.id,p:-1});const old=MUS;MUS={a:AC,rev:MIX.rev};
 const h=fm1Start(tr.patch,AC.currentTime,mtof(m),v,stripFor(MIX,tr).in);MUS=old;HELD[tr.id+':'+m]={h,b:T.playing?headNow():null,m,v};}
function liveKeyUp(tr,m){const k=tr.id+':'+m,H=HELD[k];if(!H)return;delete HELD[k];H.h.stop(AC.currentTime);

function recNote(n,at){const R=T.rec,tr=trackById(R.tr);if(!tr)return;let b=at==null?headNow():at;if(b<0)return;

let MIC=null;

// ---------- recording ----------
// kind 'audio': captures the mic; with the loop on, every pass becomes its own layer (loop-station overdub).
// kind 'notes': pads / keys you play go into the selected track's clip under the playhead.
async function startRecord(tr){await ensureAudio();if(T.rec){stop();return;}

 if(tr.type==='audio'){try{await micOn();}catch(e){toast('Microphone is blocked. Allow it in System Settings > Privacy > Microphone.',true);return;}
  MIC.chunks=[];MIC.node.port.postMessage({on:true});}

 const sr=AC.sampleRate,lat=(AC.outputLatency||0)+(AC.baseLatency||0)+(P.latency||0)/1000,first=chunks[0].t;

 const sp=spb(),tEnd=AC.currentTime,tr=trackById(R.tr);if(!tr)return;commit();

 const L0=R.pre,Lend=(tEnd-T.t0)/sp,ps=pieces(L0,Math.max(L0,Lend));let layer=0;

 for(const p of ps){const len=p.s1-p.s0;if(len<.5)continue;if(layer>0&&loopLen&&len<loopLen*.75)continue;   // a short last pass is just the stop, not a layer

  const id=uid('a');AUDIO[id]={sr,d};let dest=tr;
  if(layer>0){dest=newTrack('audio',tr.name.replace(/ layer \d+$/,'')+' layer '+(layer+1));dest.color=tr.color;dest.fx=Object.assign({},tr.fx);dest.arm=false;P.tracks.splice(P.tracks.indexOf(tr)+layer,0,dest);}
  const c=newClip('audio',p.s0,len,len);c.src=id;c.name='Take';dest.clips=dest.clips.filter(x=>x.start>=p.s0+len||x.start+x.len<=p.s0||x===c);dest.clips.push(c);layer++;}

// ---------- export: render the song (or the loop) to a WAV ----------
async function renderWav(range){await ensureAudio();const sr=44100,sp=spb(),[a,b]=range,len=(b-a)*sp+2.5;

 const sp=spb(),a=Math.floor((c.off||0)*A.sr),len=Math.min(A.d.length-a,Math.floor(c.plen*sp*A.sr)),n=16,sl=Math.floor(len/n);
 for(let i=0;i<n;i++){const d=A.d.slice(a+i*sl,a+(i+1)*sl);for(let k=0;k<64&&k<d.length;k++){d[k]*=k/64;d[d.length-1-k]*=k/64;}
  const id=uid('a');AUDIO[id]={sr:A.sr,d};dt.pads[i].sample=id;dt.pads[i].name='Chop '+(i+1);}

async function importAudioFile(file){await ensureAudio();const ab=await file.arrayBuffer(),buf=await AC.decodeAudioData(ab);const id=uid('a');AUDIO[id]={sr:buf.sampleRate,d:toMono(buf)};return id;}

 catch(e){toast('Could not read that audio file',true);}}

let DLNS=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DLNS=d;}).catch(()=>{});}catch(e){}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.style.display='none';i.onchange=()=>{const f=i.files&&i.files[0];i.remove();if(f)cb(f);};document.body.appendChild(i);i.click();}
async function saveFile(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type});
 if(DLNS){try{await DLNS.save({filename:name,data:blob});toast('Saved '+name);return true;}catch(e){toast(e&&e.code==='declined'?'Not saved':'Could not save the file here',true);return false;}}
 try{const f=new File([blob],name,{type:blob.type||type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true;}}catch(e){if(e&&e.name==='AbortError')return false;}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);toast('Saved '+name);return true;}catch(e){toast('Could not save the file here',true);return false;}}
function importCoco(text){const S=parseCocoSong(text);if(!S){toast('That is not an Agent Coco song or COCO1 code',true);return false;}stop();qFinishLayer();commit();const keepU=HIST.u.slice();importCocoSong(S);HIST.u=keepU;
 BUFC.clear();UI.cur={drums:null,synth:null,audio:null};T.head=0;newLibId();refreshAll();toast('Imported "'+P.name+'": beat, bass, chords and lead');return true;}
function openText(text){try{stop();qFinishLayer();if(/groove-studio/.test(text.slice(0,200))){deserialize(text);BUFC.clear();UI.cur={drums:null,synth:null,audio:null};T.head=0;newLibId();refreshAll();toast('Opened '+P.name);}
  else importCoco(text);}catch(e){toast('Could not open that file',true);}}
function saveSongFile(){saveFile(safeName(P.name)+'.groovestudio.json',serialize(),'application/json');}
function copyCoco(){const S=exportCocoSong(),code=cocoCode(S);const done=()=>toast('Copied! Paste it into Enter Code in the Music Room, or Import in Groove Studio on the Mac.');
 try{navigator.clipboard.writeText(code).then(done,()=>showCode(code));}catch(e){showCode(code);}}
function showCode(code){sheet('Agent Coco code',b=>{const t=el('textarea');t.id='codeOut';t.readOnly=true;t.value=code;b.append(el('div','hint','Copy this whole line (press and hold, Select All, Copy).'),t);setTimeout(()=>{t.focus();t.select();},250);});}
function pasteCode(){sheet('Load an Agent Coco song',b=>{const t=el('textarea');t.id='codeIn';t.placeholder='Paste a COCO1: code here';b.append(t,btn('Load it',()=>{if(importCoco(t.value))closeSheet();},'on'),
 btn('Open a song file instead…',()=>{closeSheet();pickFile('.json,.txt,.groovestudio,.cocosong,application/json,text/plain',async f=>openText(await f.text()));}));});}
function saveCocoFile(){const S=exportCocoSong();saveFile(safeName(P.name)+'.cocosong.json',JSON.stringify({format:'agent-coco-song',v:1,song:S}),'application/json');}
async function renderBuf(range){await ensureAudio();const sr=44100,sp=spb(),[a,b]=range,len=(b-a)*sp+2.5;
 const oc=new OfflineAudioContext(2,Math.ceil(len*sr),sr),M=makeMixer(oc);updateMix(M);
 P.tracks.forEach(t=>{const s=stripFor(M,t);s.vol.gain.value=audible(t)?t.vol*t.vol:0;s.pan.pan.value=t.pan;s.tone.frequency.value=200*Math.pow(100,t.fx.tone);s.rev.gain.value=t.fx.rev*.8;s.dly.gain.value=t.fx.dly*.7;});
 M.dly.delayTime.value=Math.min(1.9,sp*.75);const keep=T.srcs;T.srcs=[];const old=MUS;MUS={a:oc,rev:M.rev};try{sch(M,a,b,x=>(x-a)*sp,true,b);}finally{MUS=old;T.srcs=keep;}
 return oc.startRendering();}
// audio export: render the song offline, then encode it (the viewer saves .mp4 / .webm audio; WAV is not a format this page may hand over)
async function exportAudio(loop){const a=loop&&P.loop.on?P.loop.a:0,b=loop&&P.loop.on?P.loop.b:Math.max(4,Math.ceil(songEnd()/4)*4);if(b<=a){toast('Nothing to export yet',true);return;}
 if(!DLNS){if(T.playing)stop();toast('Mixing…');const bytes=await renderWav([a,b]),name=safeName(P.name)+(loop?'_loop':'')+'.wav',blob=new Blob([bytes],{type:'audio/wav'});
  sheet('Your audio file is ready',bx=>{const au=el('audio');au.controls=true;au.src=URL.createObjectURL(blob);au.style.width='100%';bx.append(au,btn('Save '+name,()=>saveFile(name,blob,'audio/wav'),'on'),el('div','hint','Choose Save to Files, AirDrop it, or send it anywhere.'));});return;}
 if(typeof MediaRecorder==='undefined'){toast('This browser cannot make audio files',true);return;}
 if(T.playing)stop();toast('Mixing…');const buf=await renderBuf([a,b]);
 const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));if(!type){toast('This browser cannot make audio files',true);return;}
 const dest=AC.createMediaStreamDestination(),src=AC.createBufferSource();src.buffer=buf;src.connect(dest);const rec=new MediaRecorder(dest.stream,{mimeType:type,audioBitsPerSecond:192000}),parts=[];
 rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);};const secs=Math.ceil(buf.duration);let left=secs;
 sheet('Making your audio file',bx=>{bx.append(el('div','',`It plays the ${loop?'loop':'song'} through silently to record it. About <b id="expLeft">${secs}</b> seconds.`),el('div','vu','<i id="expBar"></i>'));});
 const iv=setInterval(()=>{left--;const e=$('#expLeft'),bar=$('#expBar');if(e)e.textContent=Math.max(0,left);if(bar)bar.style.width=Math.min(100,(secs-left)/secs*100)+'%';},1000);
 rec.onstop=()=>{clearInterval(iv);const ext=type.startsWith('audio/mp4')?'mp4':'webm',blob=new Blob(parts,{type:type.split(';')[0]}),name=safeName(P.name)+(loop?'_loop':'')+'.'+ext;
  sheet('Your audio file is ready',bx=>{const au=el('audio');au.controls=true;au.src=URL.createObjectURL(blob);au.style.width='100%';
   bx.append(au,btn('Save '+name,()=>saveFile(name,blob,blob.type),'on'),el('div','hint','On iPhone it saves to Files. AirDrop or upload it anywhere.'));});};
 rec.start();src.start();src.onended=()=>setTimeout(()=>rec.stop(),150);}

// ---------- my songs (kept on this phone) + autosave ----------
const DB={d:null,open(){if(this.d)return Promise.resolve(this.d);return new Promise((ok,no)=>{const r=indexedDB.open('groove-studio-phone',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(this.d=r.result);r.onerror=()=>no(r.error);});},
 async put(k,v){const d=await this.open();return new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok();});},
 async get(k){const d=await this.open();return new Promise(ok=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null);});},
 async del(k){const d=await this.open();return new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>ok();t.onerror=()=>ok();});},
 async songs(){const d=await this.open();return new Promise(ok=>{const out=[],r=d.transaction('kv').objectStore('kv').openCursor(IDBKeyRange.bound('song:','song:￿'));
  r.onsuccess=()=>{const c=r.result;if(c){out.push({id:c.key.slice(5),name:c.value.name,t:c.value.t});c.continue();}else ok(out.sort((a,b)=>b.t-a.t));};r.onerror=()=>ok(out);});}};
let LIB_ID=null,LAST_AUTO='';
function newLibId(){LIB_ID='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);LAST_AUTO='';}
async function autosave(){try{if(T.rec||QK.vrec)return;const s=serialize();if(s===LAST_AUTO)return;LAST_AUTO=s;if(!LIB_ID)newLibId();await DB.put('song:'+LIB_ID,{name:P.name,t:Date.now(),s});await DB.put('cur',LIB_ID);}catch(e){}}
async function openLib(id){await autosave();const r=await DB.get('song:'+id);if(!r){toast('That song is gone',true);return;}stop();qFinishLayer();deserialize(r.s);BUFC.clear();LIB_ID=id;LAST_AUTO=r.s;UI.cur={drums:null,synth:null,audio:null};T.head=0;QK.layers=[];refreshAll();toast('Opened '+P.name);}
async function newSong(){await autosave();stop();qFinishLayer();newProject();HIST.u=[];HIST.r=[];DIRTY=false;BUFC.clear();newLibId();UI.cur={drums:null,synth:null,audio:null};T.head=0;QK.layers=[];refreshAll();toast('New song');}
async function songsSheet(){await autosave();const list=await DB.songs();sheet('My songs',b=>{b.appendChild(el('div','hint','Songs save on this phone by themselves. Save a song file now and then to keep a copy.'));
 b.appendChild(mitem('＋ New song',()=>{closeSheet();newSong();}));
 list.forEach(s=>{const r=el('div','song-item');const d=new Date(s.t);r.append(mitem(esc(s.name)+(s.id===LIB_ID?' · open':''),()=>{closeSheet();if(s.id!==LIB_ID)openLib(s.id);},d.toLocaleDateString(undefined,{month:'short',day:'numeric'})),
  btn('Delete',()=>confirmIn(b,'Delete "'+s.name+'" from this phone? This cannot be undone.','Delete',async()=>{await DB.del('song:'+s.id);if(s.id===LIB_ID){newLibId();}toast('Deleted '+s.name);}),'danger'));b.appendChild(r);});});}
// songs from the earlier phone Groove Studio (game-style songs) move into My songs once
async function migrateOld(){try{if(await DB.get('migrated'))return 0;const d=JSON.parse(localStorage.getItem('coco_phone_studio_v1')||'null');await DB.put('migrated',1);if(!d)return 0;
 const all=(d.songs||[]).slice();if(d.cur&&!all.some(s=>JSON.stringify(s)===JSON.stringify(d.cur)))all.unshift(d.cur);let n=0,t=Date.now()-all.length*1000;
 for(const S of all){if(!S||typeof S.k!=='string')continue;try{importCocoSong(JSON.parse(JSON.stringify(S)));const id='m'+(n++)+Date.now().toString(36);await DB.put('song:'+id,{name:P.name,t:t++,s:serialize()});}catch(e){}}return n;}catch(e){return 0;}}

// ---------- menu ----------
function mainMenu(){sheet('Groove Studio',b=>{const g1=el('div','mgroup');
 g1.append(mitem('My songs',()=>{closeSheet();songsSheet();},'on this phone'),mitem('🎲 Random groove',()=>{closeSheet();qFinishLayer();randomGroove();UI.cur={drums:null,synth:null,audio:null};},'beat, bass, chords, melody'),mitem('Presets',presetsSheet,'7 styles + 4 Agent Coco songs'));
 const g2=el('div','mgroup');g2.append(mitem('Save song file',()=>{closeSheet();saveSongFile();},'opens in Groove Studio on the Mac'),mitem('Open song file…',()=>{closeSheet();pickFile('.json,.txt,.groovestudio,.cocosong,application/json,text/plain',async f=>openText(await f.text()));}),
  mitem('Export the loop as audio',()=>{closeSheet();exportAudio(true);}),mitem('Export the song as audio',()=>{closeSheet();exportAudio(false);}));
 const g3=el('div','mgroup');g3.append(mitem('Copy Agent Coco code',()=>{closeSheet();copyCoco();},'for the game\'s Music Room'),mitem('Save Agent Coco song file',()=>{closeSheet();saveCocoFile();}),mitem('Load Agent Coco code or song…',pasteCode));
 b.append(g1,el('h3','','Files'),g2,el('h3','','Agent Coco'),g3,el('h3','','Help'),mitem('Quick tour',()=>{closeSheet();tour(0);}));});}
function presetsSheet(){sheet('Presets',b=>{PRESETS.forEach((p,i)=>b.appendChild(mitem(esc(p.n),()=>{closeSheet();qFinishLayer();loadPreset(i);UI.cur={drums:null,synth:null,audio:null};newLibId();refreshAll();},STYLES[p.s].n+' · '+p.bpm+' BPM')));
 b.appendChild(el('h3','','From Agent Coco'));[['Robot Pizza Disco','robot'],['Saguaro Kids','kids'],['Lair Lagoon Drift','lagoon'],["Coco's First Beat",'first']].forEach(([n,k])=>b.appendChild(mitem(esc(n),()=>{closeSheet();qFinishLayer();loadCocoPreset(k);UI.cur={drums:null,synth:null,audio:null};newLibId();refreshAll();},COCO_PRESETS[k].bpm+' BPM')));});}
const TOUR=[[0,'Jam','The easy way. Tap drums or keys, pause 2 seconds and it loops. Pick another sound and play along: each time around is a layer.'],
 [1,'Pads','16 beat pads in 5 kits. Load your own sounds on any pad. Press ● to record what you tap.'],
 [2,'Steps','Program the beat: tap or drag across the grid. 🎲 Vary gives a fresh take on the same groove.'],
 [3,'Synth','The FM-1: 12 sounds, a dice for new tones, and every knob from the desktop app.'],
 [4,'Notes','Draw melodies. Tap to add, tap to delete, drag to move. 🎲 Vary melody keeps the rhythm and picks new notes.'],
 [5,'Voice','Record your voice. With Loop on, every pass becomes a new layer, like a loop pedal. Or bring in a sound file.'],
 [6,'Song','Every track and clip on one timeline, with mute, solo and a mixer for each track.']];
function tour(i){const s=TOUR[i];if(!s){closeSheet();try{localStorage.setItem('gsm-toured','1');}catch(e){}return;}goPage(s[0]);
 sheet(`${i+1} of ${TOUR.length}: ${s[1]}`,b=>{b.appendChild(el('div','',esc(s[2])));const r=el('div','row');if(i)r.appendChild(btn('Back',()=>tour(i-1)));r.appendChild(el('div','grow'));
  r.appendChild(btn(i<TOUR.length-1?'Next':'Start jamming',()=>{if(i<TOUR.length-1)tour(i+1);else{closeSheet();goPage(0);}},'on'));b.appendChild(r);b.appendChild(el('div','hint','Swipe left and right, or use the tabs at the bottom, to move between pages.'));});}

// ---------- iPhone audio: start on the first tap, and keep playing with the ringer switch on silent ----------
let UNLOCKED=false;
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}ensureAudio().catch(()=>{});if(UNLOCKED)return;UNLOCKED=true;
 try{const n=11025,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,22050,true);v.setUint32(28,44100,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  const a=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));a.loop=true;a.setAttribute('playsinline','');a.volume=.01;a.play().catch(()=>{});window._silentEl=a;}catch(e){}}
['pointerdown','touchend'].forEach(t=>addEventListener(t,unlock,{passive:true}));
addEventListener('visibilitychange',()=>{if(document.hidden)autosave();else if(AC&&AC.state!=='running')AC.resume().catch(()=>{});});

async function boot(){newProject();initPages();initTop();$('#scrim').onclick=closeSheet;
 let moved=0;try{moved=await migrateOld();}catch(e){}
 try{const cur=await DB.get('cur');let r=cur&&await DB.get('song:'+cur);if(!r){const l=await DB.songs();if(l[0]){r=await DB.get('song:'+l[0].id);LIB_ID=l[0].id;}}else LIB_ID=cur;
  if(r){deserialize(r.s);LAST_AUTO=r.s;}else{newProject();HIST.u=[];newLibId();}}catch(e){newProject();newLibId();}
 if(!LIB_ID)newLibId();
 let pgI=0;try{pgI=+(localStorage.getItem('gsm-page')||0)||0;}catch(e){}UI.page=-1;PAGES.forEach(p=>UI.stale[p.id]=true);
 syncTop();requestAnimationFrame(()=>{goPage(pgI,false);setPage(pgI);});requestAnimationFrame(frame);setInterval(autosave,5000);
 if(moved)setTimeout(()=>toast(`Moved your ${moved} earlier phone song${moved>1?'s':''} into My songs (☰ menu)`),900);
 // the home-screen version: in Safari, show once how to install it full screen
 const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
 if(IS_PWA&&!standalone&&/iPhone|iPad|iPod/.test(navigator.userAgent)){let seen=false;try{seen=!!localStorage.getItem('gsm-installtip');localStorage.setItem('gsm-installtip','1');}catch(e){}
  if(!seen){setTimeout(()=>sheet('Make it a full-screen app',b=>{b.innerHTML='<ol style="margin:0;padding-left:20px;line-height:1.5;display:flex;flex-direction:column;gap:6px"><li>Tap the <b>Share</b> button in Safari.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open <b>Groove Studio</b> from your home screen. It runs full screen and works offline.</li></ol>';}),600);try{localStorage.setItem('gsm-toured','1');}catch(e){}}}
 let toured=false;try{toured=!!localStorage.getItem('gsm-toured');}catch(e){toured=true;}if(!toured)setTimeout(()=>tour(0),500);}
boot();
